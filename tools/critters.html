<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#e9b98a}</style>
<base href="/"><script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script></head><body>
<script type="module">
import * as THREE from 'three'
import { BigDog, makeCat, makeChihuahua, makePigeon } from './js/critter.js'
import { loadPeople, Person } from './js/people.js?v=1'
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1); document.body.appendChild(r.domElement)
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true
const sc = new THREE.Scene(); sc.background = new THREE.Color(0xe9b98a)
sc.add(new THREE.HemisphereLight(0xffe2c4, 0x6a5048, 1.3)); const sun = new THREE.DirectionalLight(0xffc98a, 2.4); sun.position.set(-3, 6, 4); sun.castShadow = true; sc.add(sun)
const fl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x5d5b5d })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; sc.add(fl)
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100)
const dog = new BigDog(); sc.add(dog.group)
const cat = makeCat(); cat.group.position.set(1.4, 0, 0.6); sc.add(cat.group)
const cat2 = makeCat({ fur: 0xe0a060 }); cat2.group.position.set(1.9, 0, -0.4); cat2.sleep(1); sc.add(cat2.group)
const chi = makeChihuahua(); chi.group.position.set(-1.2, 0, 0.6); sc.add(chi.group)
const pg = makePigeon(); pg.position.set(-1.6, 0, 1.2); sc.add(pg)
const P = new URLSearchParams(location.search)
const view = P.get('v') || 'side', expr = P.get('e') || 'normal'
await loadPeople(new THREE.LoadingManager(), ['female-e']).head
const me = new Person('female-e', { face: 0xf3c29b }); me.group.position.set(-0.5, 0, -2.6); sc.add(me.group)
dog.setExpr(expr)
const sp = +(P.get('sp') || 0), ears = +(P.get('ears') || 0), sit = +(P.get('sit') || 0)
for (let i = 0; i < 20; i++) dog.pose(0.016, { speed: sp, ears, sit, happy: expr === 'happy', air: P.get('air') === '1' })
dog.group.rotation.y = +(P.get('ry') || 0)
if (view === 'side') { cam.position.set(4.2, 1.6, 1.2); cam.lookAt(0, 0.7, 0) }
if (view === 'front') { cam.position.set(0.8, 1.4, 3.4); cam.lookAt(0, 0.9, 0) }
if (view === 'back') { cam.position.set(0.4, 2.8, -4.6); cam.lookAt(0, 0.6, 1) }
if (view === 'close') { cam.position.set(0.5, 1.35, 1.9); cam.lookAt(0, 1.15, 0.7) }
me.mixer.update(0.3)
r.render(sc, cam); window.done = true
</script></body></html>
